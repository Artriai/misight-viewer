name: Verify built APK on Android
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: 'Successful build run ID containing app and device-test APKs'
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          pattern: misight-viewer-*
          path: apks
          run-id: ${{ inputs.build_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb install -r apks/misight-viewer-debug/app-debug.apk
            adb install -r -t apks/misight-viewer-device-tests/app-debug-androidTest.apk
            adb shell am instrument -w io.github.artriai.misightviewer.test/androidx.test.runner.AndroidJUnitRunner > device-test-results.txt
            cat device-test-results.txt
            grep -q 'OK (' device-test-results.txt
            adb shell am start -n io.github.artriai.misightviewer/.MainActivity
            sleep 3
            adb exec-out screencap -p > viewer-home.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-results
          path: |
            device-test-results.txt
            viewer-home.png
          if-no-files-found: ignore
